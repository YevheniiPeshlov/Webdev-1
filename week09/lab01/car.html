<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Car Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="container">
    <header>
      <h1>Book a Car</h1>
    </header>
    <main>
      <section id="form">
        <h2>Contact Us</h2>

        <form action="process.html" method="get" id="booking">
          <div class="form-row">
            <label for="contactname">Name</label>
            <input type="text" name="contactname" id="contactname" pattern="[A-Z][a-z]+( [A-Z][a-z]+)*"
              title="Please enter a name (Surname optional) with First Letter capitalised" autofocus required>
          </div>

          <div class="form-row">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required pattern=".+@.+\..+"
              title="Please enter a valid email address (e.g. name@example.com)">
          </div>

          <p>Do you have a Driver's Licence?</p>
          <fieldset class="check">
            <label>
              <input type="radio" id="yes" name="licence" value="yes">
              Yes
            </label>

            <label>
              <input type="radio" id="no" name="licence" value="no">
              No
            </label>
          </fieldset>

          <div class="form-row">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="17" max="80" required
              title="Please enter an age between 17 and 80">
          </div>

          <div class="form-row">
            <label for="date">Start Date</label>
            <input type="date" id="date" name="date" required title="Please select a booking date">
          </div>

          <div class="form-row">
            <label for="car">Car</label>
            <select id="car" name="car">
              <option value="Ford Focus">Ford Focus</option>
              <option value="Hyundai Tucson">Hyundai Tucson</option>
              <option value="Toyota RAV4">Toyota RAV4</option>
              <option value="Renault Kadjar">Renault Kadjar</option>
              <option value="Nissan Qashqai">Nissan Qashqai</option>
            </select>
          </div>


          <p>Please provide any other details you think will be useful to us
            in the text area below (it may save us calling or emailing you,
            and help avoid delays).</p>


          <div class="form-row">
            <label for="details">More details (as much as you think we'll need!)</label>
            <textarea id="details" name="details" rows="6" cols="50"></textarea>
          </div>

          <button type="submit">Send Us the Info</button>
          <button type="reset">Clear the Info</button>

        </form>
      </section>
      <section id="image">
        <figure>
          <img src="images/car.jfif" alt="Car" class="ui fluid image">
          <figcaption>Car Rental</figcaption>
        </figure>
      </section>
    </main>
  </div>
</body>

</html>
